# RTL-Buddy Test Configuration File
rtl-buddy-filetype: test_config

# Single tb_top.sv driven by directed/random sequences selected via +TEST=
testbenches:
  - name: "tb_top"
    filelist:
      - "+incdir+../../common"
      - "../../verif/sandbox/cov_alu.sv"
      - "tb_top.sv"

tests:
  - name: "basic"
    desc: "smoke — exercise each opcode once with non-zero operands"
    reglvl: 0
    plusargs:
      TEST: basic
      lvm_verbosity: 2
    model: "alu"
    model_path: "../../design/sandbox/models.yaml"
    testbench: "tb_top"
    covers:
      - "SAND-FUNC-RESET"
      - "SAND-FUNC-OP-ADD"
      - "SAND-FUNC-OP-SUB"
      - "SAND-FUNC-OP-AND"
      - "SAND-FUNC-OP-OR"
      - "SAND-FUNC-OP-XOR"
      - "SAND-FUNC-OP-SHL"
      - "SAND-FUNC-OP-SHR"
      - "SAND-FUNC-OP-NOP"

  - name: "ops_sweep"
    desc: "every opcode with progressing operands; targets opcode and operand-range bins"
    reglvl: 0
    plusargs:
      TEST: ops_sweep
      lvm_verbosity: 2
    model: "alu"
    model_path: "../../design/sandbox/models.yaml"
    testbench: "tb_top"
    covers:
      - "SAND-FUNC-OP-ADD"
      - "SAND-FUNC-OP-SUB"
      - "SAND-FUNC-OP-AND"
      - "SAND-FUNC-OP-OR"
      - "SAND-FUNC-OP-XOR"
      - "SAND-FUNC-OP-SHL"
      - "SAND-FUNC-OP-SHR"
      - "SAND-FUNC-OP-NOP"
      - "SAND-FUNC-OPERAND-RANGE"

  - name: "flags"
    desc: "directed corners that exercise every flag (Z, N, C-ADD, C-SUB, V-ADD, V-SUB)"
    reglvl: 0
    plusargs:
      TEST: flags
      lvm_verbosity: 2
    model: "alu"
    model_path: "../../design/sandbox/models.yaml"
    testbench: "tb_top"
    covers:
      - "SAND-FUNC-FLAG-Z"
      - "SAND-FUNC-FLAG-N"
      - "SAND-FUNC-FLAG-C-ADD"
      - "SAND-FUNC-FLAG-C-SUB"
      - "SAND-FUNC-FLAG-V-ADD"
      - "SAND-FUNC-FLAG-V-SUB"

  - name: "random"
    desc: "256-cycle constrained-random — operand-range coverage closure"
    reglvl: 0
    plusargs:
      TEST: random
      CYCLES: "256"
      lvm_verbosity: 2
    model: "alu"
    model_path: "../../design/sandbox/models.yaml"
    testbench: "tb_top"
    covers:
      - "SAND-FUNC-OPERAND-RANGE"
      - "SAND-FUNC-FLAG-Z"
      - "SAND-FUNC-FLAG-N"
