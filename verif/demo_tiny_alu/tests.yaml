# RTL-Buddy Test Configuration File
rtl-buddy-filetype: test_config

# Single tb_top.sv driven by stimulus + expected results generated by
# preproc.py through spec/demo_tiny_alu/tiny_alu_model.py (the Python golden).
testbenches:
  - name: "tb_top"
    toplevel: "tb_top"
    filelist:
      - "+incdir+../../common"
      - "../../verif/demo_tiny_alu/cov_alu.sv"
      - "tb_top.sv"
    # Default Slurm reservation for this testbench's tests under
    # `rb regression --dispatch slurm` (rtl_buddy >= 6.21). Overrides the
    # cluster-wide cfg-dispatch.resources; a per-test `resources:` overrides
    # this in turn, field by field. Ignored by the default in-process run.
    resources:
      cpus: 2
      mem: 6G
      time: "00:15:00"
tests:
  - name: "basic"
    desc: "smoke — exercise each opcode once with non-zero operands; vectors from Python golden"
    reglvl: 0
    plusargs:
      TEST: basic
      lvm_verbosity: 2
    preproc:
      path: "preproc.py"
    model: "demo_tiny_alu"
    model_path: "../../design/demo_tiny_alu/models.yaml"
    testbench: "tb_top"
    covers:
      - "SAND-FUNC-RESET"
      - "SAND-FUNC-OP-ADD"
      - "SAND-FUNC-OP-SUB"
      - "SAND-FUNC-OP-AND"
      - "SAND-FUNC-OP-OR"
      - "SAND-FUNC-OP-XOR"
      - "SAND-FUNC-OP-SHL"
      - "SAND-FUNC-OP-SHR"
      - "SAND-FUNC-OP-NOP"

  - name: "ops_sweep"
    desc: "every opcode with progressing operands; targets opcode + operand-range bins"
    reglvl: 0
    # Heavier than the rest of the suite: override just mem+time (cpus is
    # inherited from the tb_top reservation above). A distinct reservation
    # means this test lands in its own Slurm array under --dispatch slurm.
    resources:
      mem: 12G
      time: "00:40:00"
    plusargs:
      TEST: ops_sweep
      lvm_verbosity: 2
    preproc:
      path: "preproc.py"
    model: "demo_tiny_alu"
    model_path: "../../design/demo_tiny_alu/models.yaml"
    testbench: "tb_top"
    covers:
      - "SAND-FUNC-OP-ADD"
      - "SAND-FUNC-OP-SUB"
      - "SAND-FUNC-OP-AND"
      - "SAND-FUNC-OP-OR"
      - "SAND-FUNC-OP-XOR"
      - "SAND-FUNC-OP-SHL"
      - "SAND-FUNC-OP-SHR"
      - "SAND-FUNC-OP-NOP"
      - "SAND-FUNC-OPERAND-RANGE"

  - name: "flags"
    desc: "directed flag corners (Z, N, C-ADD, C-SUB, V-ADD, V-SUB)"
    reglvl: 0
    plusargs:
      TEST: flags
      lvm_verbosity: 2
    preproc:
      path: "preproc.py"
    model: "demo_tiny_alu"
    model_path: "../../design/demo_tiny_alu/models.yaml"
    testbench: "tb_top"
    covers:
      - "SAND-FUNC-FLAG-Z"
      - "SAND-FUNC-FLAG-N"
      - "SAND-FUNC-FLAG-C-ADD"
      - "SAND-FUNC-FLAG-C-SUB"
      - "SAND-FUNC-FLAG-V-ADD"
      - "SAND-FUNC-FLAG-V-SUB"

  - name: "random"
    desc: "256-cycle constrained-random — operand-range coverage closure"
    reglvl: 0
    plusargs:
      TEST: random
      CYCLES: "256"
      SEED: "1"
      lvm_verbosity: 2
    preproc:
      path: "preproc.py"
    model: "demo_tiny_alu"
    model_path: "../../design/demo_tiny_alu/models.yaml"
    testbench: "tb_top"
    covers:
      - "SAND-FUNC-OPERAND-RANGE"
      - "SAND-FUNC-FLAG-Z"
      - "SAND-FUNC-FLAG-N"
