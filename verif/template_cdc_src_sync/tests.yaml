# RTL-Buddy Test Configuration File
rtl-buddy-filetype: test_config

testbenches:
  - name: "tb_top"
    filelist:
      - "+incdir+../../common"
      - "tb_top.sv"

tests:
  - name: "basic"
    desc: "Drive ck_a, toggle d_in, check propagation to q_out_c0/c1"
    reglvl:
      default: 4000
      vcs: 0
      verilator: 4000
    plusargs:
      test_cycles: 200
      lvm_verbosity: 2
    model: "template_cdc_src_sync_top"
    model_path: "../../design/template_cdc_src_sync/models.yaml"
    testbench: "tb_top"
    covers:
      - "CDC-SRC-SYNC-01"
      - "CDC-SRC-SYNC-02"
