rtl-buddy-filetype: test_config

testbenches:
  - name: "tb_top"
    filelist:
      - "+incdir+../../common"
      - "tb_top.sv"

tests:
  - name: "csr_smoke"
    desc: "CSR-direct mode: 4 ops via APB writes; scoreboard each result against SV ref + Python golden"
    reglvl: 0
    plusargs:
      TEST: csr_smoke
      lvm_verbosity: 2
    model: "demo_alu_accel_top"
    model_path: "../../design/demo_alu_accel/models.yaml"
    testbench: "tb_top"
    covers:
      - "ACCEL-CSR-WRITE"
      - "ACCEL-CSR-READ"
      - "ACCEL-CSR-DIRECT-OP"
      - "ACCEL-RESULT-MATCH"
      - "ACCEL-DONE-INC"

  - name: "fifo_stream"
    desc: "Streaming mode: SRC=1, push 12 ops (FIFO depth 8) — covers FIFO_FULL and DRAIN"
    reglvl: 0
    plusargs:
      TEST: fifo_stream
      lvm_verbosity: 2
    model: "demo_alu_accel_top"
    model_path: "../../design/demo_alu_accel/models.yaml"
    testbench: "tb_top"
    covers:
      - "ACCEL-CSR-WRITE"
      - "ACCEL-CSR-READ"
      - "ACCEL-FIFO-PUSH"
      - "ACCEL-FIFO-FULL"
      - "ACCEL-FIFO-DRAIN"
      - "ACCEL-RESULT-MATCH"
      - "ACCEL-DONE-INC"
