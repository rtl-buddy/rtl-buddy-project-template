# RTL-Buddy Spec Configuration File
rtl-buddy-filetype: spec_config

blocks:
  - name: "demo_tiny_alu"
    desc: "Tiny ALU sandbox — demonstrates rtl_buddy spec/coverage/cosim/wave/report flows"
    docs:
      - "README.md"
    coverage-items:
      - id: "SAND-FUNC-RESET"
        desc: "Outputs match reset values immediately after rst deasserts"
      - id: "SAND-FUNC-OP-ADD"
        desc: "At least one ADD with non-zero operands"
      - id: "SAND-FUNC-OP-SUB"
        desc: "At least one SUB"
      - id: "SAND-FUNC-OP-AND"
        desc: "At least one AND"
      - id: "SAND-FUNC-OP-OR"
        desc: "At least one OR"
      - id: "SAND-FUNC-OP-XOR"
        desc: "At least one XOR"
      - id: "SAND-FUNC-OP-SHL"
        desc: "At least one SHL"
      - id: "SAND-FUNC-OP-SHR"
        desc: "At least one SHR"
      - id: "SAND-FUNC-OP-NOP"
        desc: "NOP observed; result zero"
      - id: "SAND-FUNC-FLAG-Z"
        desc: "Zero flag observed both 0 and 1"
      - id: "SAND-FUNC-FLAG-N"
        desc: "Negative flag observed both 0 and 1"
      - id: "SAND-FUNC-FLAG-C-ADD"
        desc: "ADD with carry-out"
      - id: "SAND-FUNC-FLAG-C-SUB"
        desc: "SUB with borrow"
      - id: "SAND-FUNC-FLAG-V-ADD"
        desc: "ADD with signed overflow"
      - id: "SAND-FUNC-FLAG-V-SUB"
        desc: "SUB with signed overflow"
      - id: "SAND-FUNC-OPERAND-RANGE"
        desc: "Operand-A range bins (zero/low/mid/high/max) crossed with opcode"
