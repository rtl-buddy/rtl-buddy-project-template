rtl-buddy-filetype: power_config

# OpenROAD-driven power analysis for demo_tiny_alu_subsys on Nangate45.
# Consumes the tech-mapped netlist from
#   `rb synth demo_tiny_alu_subsys_synth_nangate45`.
#
# Reglvl-deferred — invoke directly:
#   rb power demo_tiny_alu_subsys_power_static  -c power/demo_tiny_alu_subsys/power.yaml
#   rb power demo_tiny_alu_subsys_power_dynamic -c power/demo_tiny_alu_subsys/power.yaml
#
# `phys-run` on the static entry is what makes a *complete* physical model
# here. A synthesis writes the model's per-module half and a power run its
# per-instance half, and the two only merge in one artefact directory — which
# a power suite in `power/` and a synth suite in `synth/` would never share.
# `phys-run` names the synthesis run in the `synth-path` suite to publish
# beside, so the static analysis lands its half in
# `synth/demo_tiny_alu_subsys/artefacts/demo_tiny_alu_subsys_synth_nangate45/`
# and `rb phys` answers all four verbs from that one model. It is a run name,
# not a path; the directory is derived, so moving the synth suite moves the
# pairing with it. Everything else this run writes — log, reports, its copy of
# the netlist — still lands in its own artefact directory.
#
# The other three runs deliberately leave `phys-run` off: one directory holds
# one power half, so pairing them all would have them overwrite each other's
# rows in turn. They publish into their own directories, per-instance rows
# only, which is the shape `rb phys module` is talking about when it names
# `rb synth` as the command that fills the missing half.
runs:
  - name: "demo_tiny_alu_subsys_power_static"
    desc: "Static-mode power on Nangate45 typ corner, paired into the synthesis' model"
    tool: "openroad"
    mode: "static"
    synth: "demo_tiny_alu_subsys_synth_nangate45"
    synth-path: "../../synth/demo_tiny_alu_subsys/synth.yaml"
    phys-run: "demo_tiny_alu_subsys_synth_nangate45"
    constraints: "../../synth/demo_tiny_alu_subsys/constraints.sdc"
    platform: "nangate45_typ"
    reglvl: 1000

  - name: "demo_tiny_alu_subsys_power_dynamic"
    desc: "Dynamic-mode power with synthetic global activity (0.2 toggle / 0.5 duty)"
    tool: "openroad"
    mode: "dynamic"
    synth: "demo_tiny_alu_subsys_synth_nangate45"
    synth-path: "../../synth/demo_tiny_alu_subsys/synth.yaml"
    constraints: "../../synth/demo_tiny_alu_subsys/constraints.sdc"
    platform: "nangate45_typ"
    activity:
      default-toggle-rate: 0.2
      default-static-prob: 0.5
    reglvl: 1000

  - name: "demo_tiny_alu_subsys_power_saif"
    desc: "Dynamic-mode power driven by SAIF captured from csr_smoke simulation"
    tool: "openroad"
    mode: "dynamic"
    synth: "demo_tiny_alu_subsys_synth_nangate45"
    synth-path: "../../synth/demo_tiny_alu_subsys/synth.yaml"
    constraints: "../../synth/demo_tiny_alu_subsys/constraints.sdc"
    platform: "nangate45_typ"
    activity:
      saif: "../../verif/demo_tiny_alu_subsys/artefacts/csr_smoke/dump.saif"
      scope: "tb_top/u_dut"
    reglvl: 1000

  - name: "demo_tiny_alu_subsys_power_postpnr"
    desc: "Post-PnR power on routed ODB (CTS-buffered clock, SAIF activity)"
    tool: "openroad"
    mode: "dynamic"
    netlist-source: "pnr"
    pnr: "demo_tiny_alu_subsys_pnr_nangate45"
    pnr-path: "../../pnr/demo_tiny_alu_subsys/pnr.yaml"
    platform: "nangate45_typ"
    activity:
      saif: "../../verif/demo_tiny_alu_subsys/artefacts/csr_smoke/dump.saif"
      scope: "tb_top/u_dut"
    reglvl: 1000
