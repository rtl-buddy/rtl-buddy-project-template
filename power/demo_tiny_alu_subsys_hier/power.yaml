rtl-buddy-filetype: power_config

# Post-P&R power for the sky130hd hierarchical pipeclean: the flat reference
# and the assembly, so the two can be compared the way their area and timing
# are. Both read the routed ODB of the corresponding `rb pnr` run, so both need
# that run to have completed.
#
#   rb power demo_tiny_alu_subsys_sky130_flat_power -c power/demo_tiny_alu_subsys_hier/power.yaml -l 1000
#   rb power demo_tiny_alu_subsys_sky130_asm_power  -c power/demo_tiny_alu_subsys_hier/power.yaml -l 1000
#
# `..._compute_mc_power` is the per-corner (tt/ss/ff) power of the
# multi-corner `..._compute_mc_pnr` run:
#
#   rb power demo_tiny_alu_subsys_sky130_compute_mc_power -c power/demo_tiny_alu_subsys_hier/power.yaml -l 1000
#
# ## Where the macro Liberty comes from
#
# Neither run names a `lib-paths` of its own. Since rtl_buddy#630 a
# `netlist-source: pnr` run inherits the macro Liberty the P&R run it reads
# names in `lib-paths` — here the SRAM's, in both runs. A macro left with no
# library at all is the `power.missing_macro_inputs` ERROR, not a silent 0 W
# row.
#
# The SRAM therefore reports the same 1.93 mW in both runs. The two hardened
# partitions reach the assembly through `blocks:`, which this run resolves but
# whose abstract Liberty it does not read (rtl_buddy#684): OpenSTA's
# `write_timing_model` emits timing arcs and no power tables, so the
# partitions are 0 W either way and the result names both as cells with no
# Liberty power data, and read in, its function-less outputs would stop
# activity propagation and zero the switching of everything they drive. The
# assembly's total — 4.73 mW against 3.57 mW flat — is the top-level glue plus
# the SRAM; it leaves out the partitions' own cell power.
runs:
  - name: "demo_tiny_alu_subsys_sky130_flat_power"
    desc: "Post-P&R static power of the flat sky130hd run (standard cells plus the OpenRAM SRAM)"
    tool: "openroad"
    mode: "static"
    netlist-source: "pnr"
    pnr: "demo_tiny_alu_subsys_sky130_flat_pnr"
    pnr-path: "../../pnr/demo_tiny_alu_subsys_hier/pnr.yaml"
    platform: "sky130hd_tt"
    reglvl: 1000

  # Per-corner power of the multi-corner compute-partition run
  # (rtl_buddy#104). The reported watts are the worst (highest-total)
  # corner's; each corner's own are in the result's `corners`.
  - name: "demo_tiny_alu_subsys_sky130_compute_mc_power"
    desc: "Post-P&R static power of the multi-corner compute partition, per corner (tt/ss/ff)"
    tool: "openroad"
    mode: "static"
    netlist-source: "pnr"
    pnr: "demo_tiny_alu_subsys_sky130_compute_mc_pnr"
    pnr-path: "../../pnr/demo_tiny_alu_subsys_hier/pnr.yaml"
    platform: "sky130hd_mc"
    reglvl: 1000

  - name: "demo_tiny_alu_subsys_sky130_asm_power"
    desc: "Post-P&R static power of the assembly (top-level glue plus the SRAM; the partition abstracts carry no power tables)"
    tool: "openroad"
    mode: "static"
    netlist-source: "pnr"
    pnr: "demo_tiny_alu_subsys_sky130_asm_pnr"
    pnr-path: "../../pnr/demo_tiny_alu_subsys_hier/pnr.yaml"
    platform: "sky130hd_tt"
    reglvl: 1000
