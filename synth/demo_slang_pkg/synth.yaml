# RTL-Buddy Synthesis Configuration File
#
# Demonstrator for the yosys-slang elaboration frontend. The design at
# `design/demo_slang_pkg/` uses an `import pkg::*` clause in the module
# header — Yosys's built-in `read_verilog -sv -defer` rejects that
# (TOK_IMPORT error); yosys-slang's `read_slang` accepts it.
#
# Wired with `tool_overrides.yosys.frontend: "slang"` so this block
# is independent of the project-wide `cfg-synth-tools.opts.frontend`
# setting. To run:
#
#   1. Build yosys-slang per tools/yosys-slang/SETUP_OSX.md.
#   2. Point rtl_buddy at *your* slang.so via the
#      RTL_BUDDY_SLANG_PLUGIN environment variable — export it from a
#      toolchain env script, or put it in the gitignored
#      `.rtl-buddy/.env` at the project root (rb loads it
#      automatically). Alternatively hard-code `plugin_path` below
#      (absolute, or relative to the project root); an explicit path
#      overrides the environment.
#   3. Then:
#        uv run rb synth demo_slang_pkg_synth_slang \
#            -c synth/demo_slang_pkg/synth.yaml
#
# Requires rtl_buddy>=4.1.0 for the `frontend` field to be honored;
# the RTL_BUDDY_SLANG_PLUGIN / `.rtl-buddy/.env` fallback needs
# >=6.11.0 (this template pins newer).
#
# `reglvl: 1000` excludes this block from default `rb synth-regression`
# runs so the template's regression stays green on a vanilla install
# (no yosys-slang installed, no rtl_buddy bump). Bump `--reg-level` to
# include it once your environment is set up.

rtl-buddy-filetype: synth_config

syntheses:
  - name: "demo_slang_pkg_synth_slang"
    desc: "yosys-slang frontend demo: parameterised package import in module header"
    model: "demo_slang_pkg_top"
    model_path: "../../design/demo_slang_pkg/models.yaml"
    tool: "yosys"
    constraints: "constraints.sdc"
    reglvl: 1000
    tool_overrides:
      yosys:
        frontend: "slang"
        # plugin location comes from RTL_BUDDY_SLANG_PLUGIN (see header)
