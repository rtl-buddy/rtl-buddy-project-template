# RTL-Buddy Project Root Configuration File
rtl-buddy-filetype: project_root_config

# Supported platform configuration
cfg-platforms:

  - os: "osx"
    unames: ["Darwin"]
    builder: "verilator" # default rtl-builder
    verible: "verible-macos"

  - os: "server"
    unames: ["Linux"]
    builder: "verilator" # default rtl-builder
    verible: "verible-x86_64"

# End supported platform configuration

# RTL builder configuration

rtl-builder-template: &rtl-builder-template
  - sim-rand-seed: 31310

# multiple builders can be specified
cfg-rtl-builder: 
  - <<: *rtl-builder-template
    name: "verilator"
    builder: "verilator" # executable name
    sim-rand-seed-prefix: "+verilator+seed+"
    builder-opts:
      # debug-mode with tracing
      # TODO: >=vrltr5.040 will require -Wno-SPECIFYIGN
      debug: 
        compile-time: >-
          --binary --timescale 1ns/10ps 
          +1800-2023ext+sv
          -sv
          --compiler clang
          --x-initial unique
          --x-assign 1
          --assert
          --assert-case
          -Wall
          -Wwarn-lint
          -Wno-DECLFILENAME
          -Wno-PINCONNECTEMPTY
          -Wno-UNUSEDPARAM
          -Wno-UNUSEDSIGNAL
          -Wno-WIDTHEXPAND
          -Wno-WIDTHTRUNC
          -o simv
          +define+DUMP
          --trace-fst
          --trace-params
          --trace-structs
          --trace-max-array 32
          --trace-max-width 256
        # run-time 
        # rand-reset (2: rand, 1:ones, 0:zeros)
        run-time: &vrl_run_time >-
          +verilator+rand+reset+2
          -x-initial unique
      # regression-mode w/o trace
      reg: 
        compile-time: >-
          --binary --timescale 1ns/10ps 
          +1800-2023ext+sv
          -sv
          --compiler clang
          --x-initial unique
          --x-assign 1
          --assert
          --assert-case
          -Wall
          -Wwarn-lint
          -Wno-DECLFILENAME
          -Wno-PINCONNECTEMPTY
          -Wno-UNUSEDPARAM
          -Wno-UNUSEDSIGNAL
          -Wno-WIDTHEXPAND
          -Wno-WIDTHTRUNC
          -o simv
        run-time: *vrl_run_time
      # coverage-mode for merged coverage collection and HTML export
      cov:
        compile-time: >-
          --binary --timescale 1ns/10ps
          +1800-2023ext+sv
          -sv
          --compiler clang
          --x-initial unique
          --x-assign 1
          --assert
          --assert-case
          --coverage-expr
          --coverage-expr-max 256
          --coverage-line
          --coverage-toggle
          --coverage-user
          -Wall
          -Wwarn-lint
          -Wno-DECLFILENAME
          -Wno-PINCONNECTEMPTY
          -Wno-UNUSEDPARAM
          -Wno-UNUSEDSIGNAL
          -Wno-WIDTHEXPAND
          -Wno-WIDTHTRUNC
          -o simv
        run-time: *vrl_run_time
    # sim executable
    builder-simv: "obj_dir/simv"
  - <<: *rtl-builder-template
    name: "vcs"
    builder: "vcs" # executable name
    sim-rand-seed-prefix: "+ntb_random_seed="
    builder-opts:
      # debug-mode with tracing
      debug: 
        compile-time: >-
          -sverilog -full64 +vpi 
          -timescale=1ns/10ps
          -l simv_compile.log
          +define+DUMP
          -debug_access+all+class
          -debug_acc+all+class+pp+dmptf
          -debug_region+cell+encrypt
          +lint=TFIPC-L
          +dump_vpd
        run-time: >-
          -l simv.log 
          -xlrm hier_inst_seed -diag hier_seed
      # regression-mode w/o trace
      reg:  
        compile-time: >- 
          -sverilog -full64 +vpi 
          -timescale=1ns/10ps
          -l simv_compile.log
        run-time: >-
          -l simv.log 
          -xlrm hier_inst_seed -diag hier_seed
    builder-simv: "simv"
    # vcs
    # TODO in case we need platform specific builder, can use -platform in builder name
  - <<: *rtl-builder-template
    name: "icarus"
    builder: "iverilog" # executable name
    simulator-family: "icarus"
    sim-rand-seed-prefix: "+seed="
    builder-opts:
      # SIM_ICARUS gates out constructs Icarus 12 cannot compile
      # (cover-property SVA, interface-class LVM hooks); see
      # verif/demo_tiny_alu/ and common/lvm_core.sv.
      # debug-mode dumps VCD via $dumpfile/$dumpvars when DUMP is defined
      debug:
        compile-time: >-
          -g2012
          -gsupported-assertions
          -DDUMP
          -DSIM_ICARUS
        run-time: ""
      # regression-mode w/o trace
      reg:
        compile-time: >-
          -g2012
          -gsupported-assertions
          -DSIM_ICARUS
        run-time: ""
    # simv is a thin wrapper rtl_buddy writes around `vvp <snapshot>.vvp`
    builder-simv: "simv"
    # icarus
# cfg-rtl-builder
# End RTL builder configuration

# Verible configuration
# Both entries point at /usr/local/bin — the rtl-buddy-tools deployment
# convention (https://github.com/rtl-buddy/rtl-buddy-tools `make verible`
# + its /usr/local/bin symlinks; one pinned version on macOS and Linux,
# replacing the old brew install / site module). Where the symlinks are
# not laid down, rb falls back to PATH with a warning — sourcing
# rtl-buddy-tools' env-macos.zsh / env-linux.sh covers that case.
cfg-verible:
  - name: "verible-macos"
    path: "/usr/local/bin"
    extra_args: &verible_extra_args
      # extra verible lint args
      # see lint help for --rules, comma-sep lint rules, (-) excl, (+) incl
      lint:
        - >-
          --rules=
          -explicit-parameter-storage-type,
          -unpacked-dimensions-range-ordering,
          -module-filename,
          -no-trailing-spaces,
          -parameter-name-style
  - name: "verible-x86_64"
    path: "/usr/local/bin"
    extra_args:
      <<: *verible_extra_args
# End verible configuration

# Coverage post-processing configuration
cfg-coverage:
  - name: "verilator"
    use-lcov: true
  - name: "vcs"
    use-lcov: true

cfg-coverview:
  - name: "verilator"
    config:
      title: "rtl-buddy coverview"
    generate-tables: "line"
# End coverage configuration

# Surfer waveform viewer (used by `rb wave` and
# `verif/demo_tiny_alu/build_report.py` for headless screenshot capture).
# `path: "surfer"` resolves via $PATH.
cfg-surfer:
  - name: "surfer-default"
    path: "surfer"
    wcp-port: 0
# End surfer configuration

# Synthesis tool defaults — `tool:` in synth.yaml selects the entry.
cfg-synth-tools:
  - name: "yosys"
    tool: "yosys"
    opts:
      synth-args: ""
      abc-args: ""

  # Yosys for elaboration, then OpenROAD for STA. Needed by any synth entry with
  # `tool: "openroad"` — synth/demo_synth_macro is the one here. Reads the PDK
  # Liberty and both LEFs, plus whatever `lib-paths` / `lef-paths` a hard-macro
  # design adds, so the LEFs have to be downloaded and not just the Liberty.
  - name: "openroad"
    tool: "openroad"
    opts:
      strategy: "AREA"

# Technology / PDK assets. Files are not vendored — fetch with
# `synth/demo_tiny_alu_subsys/download_pdk.sh` (or the alu equivalent)
# before running tech-mapped synth or P&R. Multiple PDKs can be
# declared; synth + pnr platforms below select which one to use.
cfg-pdks:
  - name: "nangate45"
    site: "FreePDK45_38x28_10R_NP_162NW_34O"
    corners:
      typ: "pdk/nangate45/lib/NangateOpenCellLibrary_typical.lib"
    tech-lef: "pdk/nangate45/lef/NangateOpenCellLibrary.tech.lef"
    macro-lef: "pdk/nangate45/lef/NangateOpenCellLibrary.macro.mod.lef"
    cell-gds: "pdk/nangate45/gds/NangateOpenCellLibrary.gds"
    klayout-tech: "pdk/nangate45/FreePDK45.lyt"
    klayout-props: "pdk/nangate45/FreePDK45.lyp"
    tie-hi: "LOGIC1_X1/Z"
    tie-lo: "LOGIC0_X1/Z"
    fill-cells:
      - FILLCELL_X1
      - FILLCELL_X2
      - FILLCELL_X4
      - FILLCELL_X8
      - FILLCELL_X16
      - FILLCELL_X32
    # No `pdn-config`: the Nangate45 demo flow has no power grid, which is one
    # of the reasons the hierarchical pipeclean runs on sky130hd instead.

  # SkyWater 130nm high-density standard cells. The second PDK in this
  # template, and the one the hierarchical-P&R example
  # (synth|pnr/demo_tiny_alu_subsys_hier/) runs on: it is a real silicon
  # process with real hard macros, and it needs a PDN, which is exactly where
  # a hierarchical flow's block/top power-pin alignment is tested.
  #
  # Values are ORFS' flow/platforms/sky130hd/config.mk, transcribed key by key.
  # Fetch the files with `synth/demo_tiny_alu_subsys_hier/download_pdk.sh`.
  - &sky130hd_common
    name: "sky130hd"
    site: "unithd"
    corners:
      tt: "pdk/sky130hd/lib/sky130_fd_sc_hd__tt_025C_1v80.lib"
    tech-lef: "pdk/sky130hd/lef/sky130_fd_sc_hd.tlef"
    macro-lef: "pdk/sky130hd/lef/sky130_fd_sc_hd_merged.lef"
    cell-gds: "pdk/sky130hd/gds/sky130_fd_sc_hd.gds"
    klayout-tech: "pdk/sky130hd/sky130hd.lyt"
    klayout-props: "pdk/sky130hd/sky130hd.lyp"
    # conb_1 drives both constants; ORFS TIEHI/TIELO_CELL_AND_PORT.
    tie-hi: "sky130_fd_sc_hd__conb_1/HI"
    tie-lo: "sky130_fd_sc_hd__conb_1/LO"
    fill-cells:
      - sky130_fd_sc_hd__fill_1
      - sky130_fd_sc_hd__fill_2
      - sky130_fd_sc_hd__fill_4
      - sky130_fd_sc_hd__fill_8
    # ORFS IO_PLACER_H / IO_PLACER_V. Sky130 has no `metal3`, so the default
    # Nangate45 layer names are a hard error here, not a bad default.
    pin-layers:
      horizontal: "met3"
      vertical: "met2"

    # ── rtl_buddy#101 flow parameterisation ──────────────────────────────
    # Requires an rtl_buddy release carrying the PR for rtl_buddy#101; the
    # version this project pins does not have these keys yet.

    # ORFS PLACE_DENSITY for sky130hd. The 0.70 that the flow used to spell
    # out is calibrated for FreePDK45's 10-track cells; sky130hd's 9-track
    # cells plus a large hard macro do not converge at it.
    placement:
      density: 0.60
      padding: 1

    # ORFS DONT_USE_CELLS. The *probe* cells carry metal on every layer and
    # the *lpflow* cells belong to multi-power-domain flows; either one picked
    # by synthesis or by timing repair is a cell this flow cannot legalise.
    dont-use-cells:
      - "sky130_fd_sc_hd__probe_p_8"
      - "sky130_fd_sc_hd__probec_p_8"
      - "sky130_fd_sc_hd__lpflow_bleeder_1"
      - "sky130_fd_sc_hd__lpflow_clkbufkapwr_1"
      - "sky130_fd_sc_hd__lpflow_clkbufkapwr_16"
      - "sky130_fd_sc_hd__lpflow_clkbufkapwr_2"
      - "sky130_fd_sc_hd__lpflow_clkbufkapwr_4"
      - "sky130_fd_sc_hd__lpflow_clkbufkapwr_8"
      - "sky130_fd_sc_hd__lpflow_clkinvkapwr_1"
      - "sky130_fd_sc_hd__lpflow_clkinvkapwr_16"
      - "sky130_fd_sc_hd__lpflow_clkinvkapwr_2"
      - "sky130_fd_sc_hd__lpflow_clkinvkapwr_4"
      - "sky130_fd_sc_hd__lpflow_clkinvkapwr_8"
      - "sky130_fd_sc_hd__lpflow_decapkapwr_12"
      - "sky130_fd_sc_hd__lpflow_decapkapwr_3"
      - "sky130_fd_sc_hd__lpflow_decapkapwr_4"
      - "sky130_fd_sc_hd__lpflow_decapkapwr_6"
      - "sky130_fd_sc_hd__lpflow_decapkapwr_8"
      - "sky130_fd_sc_hd__lpflow_inputiso0n_1"
      - "sky130_fd_sc_hd__lpflow_inputiso0p_1"
      - "sky130_fd_sc_hd__lpflow_inputiso1n_1"
      - "sky130_fd_sc_hd__lpflow_inputiso1p_1"
      - "sky130_fd_sc_hd__lpflow_inputisolatch_1"
      - "sky130_fd_sc_hd__lpflow_isobufsrc_1"
      - "sky130_fd_sc_hd__lpflow_isobufsrc_16"
      - "sky130_fd_sc_hd__lpflow_isobufsrc_2"
      - "sky130_fd_sc_hd__lpflow_isobufsrc_4"
      - "sky130_fd_sc_hd__lpflow_isobufsrc_8"
      - "sky130_fd_sc_hd__lpflow_isobufsrckapwr_16"
      - "sky130_fd_sc_hd__lpflow_lsbuf_lh_hl_isowell_tap_1"
      - "sky130_fd_sc_hd__lpflow_lsbuf_lh_hl_isowell_tap_2"
      - "sky130_fd_sc_hd__lpflow_lsbuf_lh_hl_isowell_tap_4"
      - "sky130_fd_sc_hd__lpflow_lsbuf_lh_isowell_4"
      - "sky130_fd_sc_hd__lpflow_lsbuf_lh_isowell_tap_1"
      - "sky130_fd_sc_hd__lpflow_lsbuf_lh_isowell_tap_2"
      - "sky130_fd_sc_hd__lpflow_lsbuf_lh_isowell_tap_4"

    # ORFS PDN_TCL. Committed, unlike everything else this PDK entry names,
    # because it is flow configuration rather than vendor data. It lives under
    # pnr/ so it is not caught by the project's `**.tcl` gitignore rule.
    pdn-config: "pnr/sky130hd/pdn.tcl"

  # The same PDK, with the block-level power grid in place of the top-level
  # one. Everything but `pdn-config` is merged from the entry above.
  #
  # A design being hardened for someone else to instantiate needs a different
  # grid from a design that is the top: its straps stop at met4 and are exposed
  # there, so the parent's met5 can cross it and via down. See
  # pnr/sky130hd/pdn_block.tcl, which is where that convention is written out,
  # and pnr/demo_tiny_alu_subsys_hier/README.md for what happens without it.
  - <<: *sky130hd_common
    name: "sky130hd_block"
    pdn-config: "pnr/sky130hd/pdn_block.tcl"

# Synth platforms — name + PDK + corner. Referenced by `platform:` in synth.yaml.
cfg-synth-platforms:
  - name: "nangate45_typ"
    pdk: "nangate45"
    corner: "typ"

  - name: "sky130hd_tt"
    pdk: "sky130hd"
    corner: "tt"

# P&R platforms — name + PDK + STA corner + P&R-specific knobs.
# Referenced by `platform:` in pnr.yaml.
cfg-pnr-platforms:
  - name: "nangate45_typ"
    pdk: "nangate45"
    corner: "typ"
    cts-buffer: "BUF_X4"
    routing-layers:
      signal: "metal2-metal8"
      clock: "metal4-metal8"

  - name: "sky130hd_tt"
    pdk: "sky130hd"
    corner: "tt"
    # A list, not one name (rtl_buddy#101): CTS picks a drive strength per
    # stage, and a single buffer has to be strong enough for the worst sink
    # group and is then far too strong everywhere else.
    # rtl_buddy#101 also widens this key to accept a list, so CTS can pick a
    # drive strength per stage instead of using one buffer everywhere:
    #
    #   cts-buffer:
    #     - "sky130_fd_sc_hd__clkbuf_4"
    #     - "sky130_fd_sc_hd__clkbuf_8"
    #     - "sky130_fd_sc_hd__clkbuf_16"
    #
    # Left in the single-name form deliberately. Unlike the new `placement:`,
    # `dont-use-cells:` and `pdn-config:` keys above — which an rtl_buddy that
    # does not know them simply ignores, so only the sky130hd runs that need
    # them are affected — a list here is a *type* change to a key that already
    # exists, and the version this project pins refuses to load
    # root_config.yaml at all when it sees one. That would take every flow in
    # the repo down, not just this example. Switch to the list once the pin is
    # on a release carrying rtl_buddy#101.
    cts-buffer: "sky130_fd_sc_hd__clkbuf_4"
    # Off deliberately. The OpenRAM macro's two clock pins sit at the same
    # point in the layout, and the sink-clustering pass fails on coincident
    # sinks with `[ERROR CTS-0080] Sink not found` (reported in rtl_buddy#101).
    cts-sink-clustering: false
    routing-layers:
      signal: "met1-met5"
      clock: "met3-met5"

  # For runs that harden a block rather than build a top. Same corner and same
  # CTS settings; the two differences are the PDK entry, which brings the
  # block-level power grid, and the routing layers, which stop at met4 so met5
  # is left clear for the parent that will instantiate this block as a macro.
  - name: "sky130hd_tt_block"
    pdk: "sky130hd_block"
    corner: "tt"
    cts-buffer: "sky130_fd_sc_hd__clkbuf_4"
    cts-sink-clustering: false
    routing-layers:
      signal: "met1-met4"
      clock: "met3-met4"
# End synth / pnr configuration

# Power analysis tool defaults — `tool:` in power.yaml selects the entry.
# Power runs reuse cfg-pnr-platforms entries for Liberty/corner lookup.
cfg-power-tools:
  - name: "openroad"
    tool: "openroad"
# End power configuration

# CDC lint tool defaults — `tool:` in cdc.yaml selects the entry.
cfg-cdc-tools:
  - name: "rtl-buddy-cdc"
    tool: "rtl-buddy-cdc"
    opts:
      sync-depth: 2
# End CDC configuration

# Formal tool defaults — add `fpv/` suites when your project is ready
# to exercise `rb fpv` or `rb fpv-regression`.
cfg-fpv-tools:
  - name: "sby"
    tool: "sby"
    opts:
      timeout: 600
      extra-args: ""
      # Path to the built yosys-slang plugin, required by any
      # verification with `frontend: slang` (e.g. demo_abv_basic,
      # whose bound checker only elaborates under slang; demo_abv_features
      # vacuity variant). Build per tools/yosys-slang/SETUP_OSX.md.
      # Left unset so the machine-local location comes from the
      # RTL_BUDDY_SLANG_PLUGIN environment variable — export it from a
      # toolchain env script, or put it in the gitignored
      # `.rtl-buddy/.env` next to this file (KEY=VALUE; rb loads it
      # automatically). Setting an explicit path here overrides both.
      plugin-path: ""
# End formal configuration

# SystemC cosim — required when a testbench in tests.yaml declares a
# `systemc:` block (Verilator --sc + user-provided sc_main.cpp). Absence
# is only fatal when a SystemC test actually runs, so this block is safe
# to keep in projects that do not (yet) use SystemC.
#
#   home    — install root containing include/ and lib/libsystemc.{a,dylib,so}.
#             When unset (null), falls back to the $SYSTEMC_HOME env var.
#             ${VAR} and ~ in the value are expanded.
#   cxx     — optional. Pin the C++ compiler used to link the cosim binary
#             for ABI parity with the locally-built libsystemc (libstdc++ vs
#             libc++, GCC vs clang version).
#   cflags  — project-wide -CFLAGS tokens. Per-testbench `systemc.cflags`
#             append on top; the SystemC include path is auto-emitted.
#   ldflags — project-wide -LDFLAGS tokens. Per-testbench `systemc.ldflags`
#             append on top; -lsystemc is auto-emitted.
cfg-systemc:
  home: "${SYSTEMC_HOME}"
  # cxx: "/opt/homebrew/bin/g++-15"
  # Match the C++ standard used to build libsystemc. SystemC 3.0.0 is
  # commonly built as C++20 (libsystemc exports sc_api_version_3_0_0_cxx202002L);
  # set this to the std your local SystemC was compiled with.
  cflags: ["-std=c++20"]
  ldflags: []
# End SystemC configuration


# Regression config
cfg-rtl-reg:
  {
    # regression config yaml, discover full list of reg from this root
    reg-cfg-path: "regression.yaml",
    # The CDC manifest lives with its analyses under lint/cdc/, away from
    # the project root where the ./cdc_regression.yaml filename convention
    # would find it. This per-flow key (rtl_buddy >= 6.35, rtl_buddy#389)
    # lets bare `rb cdc-regression` and `rb graph build` discover it; the
    # synth/fpv/fpga manifests sit at the root and need no such entry.
    cdc-reg-cfg-path: "lint/cdc/cdc_regression.yaml"
  }

# Parallel dispatch (rtl_buddy >= 6.21). By default a regression runs
# in-process, one test at a time. Two backends fan the tests out in parallel
# after a single shared build:
#
#   rb regression --dispatch slurm                  # a cluster
#   rb regression --dispatch local-parallel -j 4    # this machine (>= 6.24)
#
# `backend` is intentionally left unset so the default stays local
# (in-process) — nothing here affects a plain `rb regression`. Selecting
# slurm requires a Slurm client on the submit host and a shared filesystem
# visible at the same paths on the compute nodes; local-parallel requires
# nothing at all (and works on macOS, where Slurm does not run). See
# https://rtl-buddy.github.io/rtl_buddy/latest/concepts/dispatch/
#
# NOTE: everything below this line is Slurm's. `local-parallel` runs jobs as
# plain subprocesses on one host, which cannot enforce a reservation, so it
# IGNORES `resources`/`compile`/`max-jobs-per-array` — it warns once per run
# saying so — and has no accounting source, so it produces no right-sizing
# advice. Its one knob is `-j/--jobs` (or `jobs:` below); size that for the
# MEMORY your heaviest tests need, since nothing else limits them.
cfg-dispatch:
  # backend: slurm          # uncomment (or pass --dispatch slurm) to opt in

  # jobs: 4                 # local-parallel pool size; default min(4, cpus)

  # Cluster-wide default reservation for each SIMULATION job. Per-testbench
  # and per-test `resources:` in tests.yaml override these field-by-field
  # (see verif/demo_tiny_alu/tests.yaml for a worked example).
  resources:
    cpus: 2
    mem: 4G
    time: "00:30:00"        # QUOTE time values — an unquoted 4:00:00 is
                            # YAML sexagesimal (14400), which Slurm reads as
                            # minutes. rtl_buddy rejects the unquoted form.

  # The shared build usually needs more than the sims it precedes; give the
  # dispatched build job its own reservation. Sharing is builder-generic
  # (Verilator, VCS, Icarus) as of rtl_buddy 6.22 — where a builder cannot
  # share (e.g. a `builder-simv:` pinned to an absolute path), the compile
  # runs inside each sim job and rtl_buddy reserves the per-field MAXIMUM of
  # this block and the resolved sim reservation, since one allocation has to
  # carry both phases. Right-sizing advice then points its edit hint here
  # rather than at the test when the compile side governs the allocation.
  compile:
    cpus: 4
    mem: 8G
    time: "01:00:00"

  # Extra flags passed to sbatch verbatim (partition, account, QOS, ...).
  # sbatch-args:
  #   - --partition=verif
  #   - --account=chip

  max-jobs-per-array: 64    # concurrency cap PER submitted array
  poll-interval: 10         # seconds between queue polls while collecting

  # After a dispatched run, rtl_buddy compares reserved vs used (from sacct)
  # and prints right-sizing advice — it suggests, you apply. Needs slurmdbd
  # accounting; degrades gracefully to no advice without it.
  rightsize:
    report: true

# TODO cfg-rtl-lint : RTL Code Linter
# cfg-rtl-lint : support spyglass

# TODO cfg-rtl-cust-rel : RTL Customer Release Flow
# cfg-rtl-cust-rel : support obfu, encryption
