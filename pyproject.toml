[project]
name = "rtl-buddy-project-template"
version = "0.0.0"
requires-python = ">=3.11,<3.12"
dependencies = [
  "rtl_buddy[graph-extract]==6.37.2",
  "rtl-buddy-cdc[slang]",
  "rtl-buddy-xeno[verible,slang]",
  "rtl-buddy-axi-profiler[notebook]",
  "cocotb==2.0.1",
  "pytest==8.4.2",
  "info-process",
  "peakrdl",
  "peakrdl-regblock",
]

[tool.uv]
package = false
# Aggregator-level floor: force rtl-buddy-sch >=0.7.0 across every transitive
# path, regardless of what each consumer (rtl_buddy, rtl-buddy-xeno, ...)
# declares. The viewer distribution renamed for 0.7.0+ (releases <=0.5.0
# shipped as rtl-buddy-view, now frozen on PyPI); rtl_buddy >=6.32.1
# dual-probes both dist names and rtl-buddy-xeno's [verible] extra depends
# on the new name, so nothing in this project's graph should resolve
# rtl-buddy-view anymore. That absence matters: both dists ship the same
# console scripts and the same rtl_buddy_view import package, so having
# both installed is a collision, not a fallback. The consumers carry
# floors + runtime guards of their own; this constraint is
# belt-and-suspenders so no transitive path can ever drag the resolution
# below 0.10.0 — the release that makes the schematic readable: a
# pin fed by procedural logic names the net it binds (rb.net), a
# bundle marks the pins it stands for with junction dots, and
# producer-baked CDC/RDC accents survive the theme re-tint. The
# demo designs and hint sidecars here exercise all of it.
constraint-dependencies = ["rtl-buddy-sch>=0.10.0"]

[tool.uv.sources]
info-process = { git = "https://github.com/rtl-buddy/info-process.git" }
peakrdl = { git = "https://github.com/rtl-buddy/PeakRDL.git", subdirectory = "peakrdl" }
peakrdl-regblock = { git = "https://github.com/rtl-buddy/PeakRDL-regblock.git" }
# Pinned CDC linter consumed via subprocess by `rb cdc`. No PyPI release
# yet; pin to the git repo so `which rtl-buddy-cdc` works after `uv sync`.
# Pinned to the v0.3.3 release tag for reproducibility — bump the tag
# (and re-lock) when consuming a newer rtl-buddy-cdc release.
rtl-buddy-cdc = { git = "https://github.com/rtl-buddy/rtl-buddy-cdc.git", tag = "v0.3.3" }
# Mutation engine driven by `rb mut`, consumed from PyPI since its 0.1.1
# release (rtl-buddy/rtl-buddy-xeno#18 resolved — the git pin predates it).
# The [verible,slang] extras (declared on the dependency above) pull the
# Verible CST + pyslang toolchain the structural mutation operators need;
# [verible] also carries the rtl-buddy-sch dependency.
# AXI interconnect profiler driven by `rb axi-profile`. Not on PyPI yet
# (no release workflow), so pin the git repo so the `axi-profiler` binary
# resolves into the venv after `uv sync`. The [notebook] extra (declared on
# the dependency above) pulls marimo + altair/polars/pandas/pyarrow so
# `rb axi-profile notebook` / the rtl-buddy-view "Open in marimo" button work
# in-venv — the notebook launcher imports rtl_buddy_axi_profiler in the rb
# interpreter, so it must live here, not as an out-of-band tool. Self-bounds
# pywellen<0.25 (matches rtl_buddy's own bound; the 0.25 trace-reader API
# break is unported here).
rtl-buddy-axi-profiler = { git = "https://github.com/rtl-buddy/rtl-buddy-axi-profiler.git" }
