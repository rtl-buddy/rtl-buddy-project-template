# RTL-Buddy Mutation Testing Configuration File
rtl-buddy-filetype: mut_config

# ─── PREREQUISITES ───
# Same as mut.yaml: rb mut ships in rtl_buddy (template pins 6.1.0) and the
# rtl-buddy-xeno engine is pinned as a git source in pyproject.toml
# ([verible,slang] extras), so a clean `uv sync` installs it. Running a
# campaign needs a built yosys-slang plugin (the kill oracle below is the
# slang-fronted cover verification). See mut.yaml and rtl-buddy/rtl-buddy-xeno#18.
# ────────────────────────────────────────────────────────────────────────
#
# Companion to mut.yaml that uses the *cover* verification as the kill
# oracle instead of the safety proof. Where the safety property only
# catches mutants that push cnt above MAX, the cover property
# (`cnt == MAX` is reachable) catches the complementary failure mode:
# mutants that leave the counter stuck low so it can never reach MAX.
# Running both campaigns shows why one property is not a sufficient
# oracle on its own.
name: "demo_abv_basic_cover"
model: "demo_abv_basic"
model_path: "../../../design/demo_abv/models.yaml"

design_file: "../../../design/demo_abv/demo_abv_basic.sv"

operators:
  - arith_flip
  - cond_negate
  - cond_const
  - assign_drop

verify:
  fpv_config: "fpv.yaml"
  verification: "demo_abv_basic_reaches_max"   # cover oracle

budget:
  max_mutants: 20
  schedule: round_robin
