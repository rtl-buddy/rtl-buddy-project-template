# RTL-Buddy Mutation Testing Configuration File
rtl-buddy-filetype: mut_config

# ─── PREREQUISITES (mutation engine not yet installable from a clean checkout) ───
# With this template's current pins, the only thing missing to run this
# campaign is the mutation engine itself:
#   - rtl_buddy >= 5.2            ✓ satisfied (template pins 5.3.0)
#   - Python >= 3.11              ✓ satisfied (rtl-buddy-xeno relaxed its
#                                  floor to >=3.11, so no 3.13 is needed)
#   - rtl-buddy-xeno[verible,slang] — the mutation engine; NOT on PyPI yet,
#                                  install from its git source until it is
#                                  published (rtl-buddy/rtl-buddy-xeno#18)
#   - a built yosys-slang plugin  (already required by this FPV demo;
#                                  see tools/yosys-slang/SETUP_OSX.md)
# Declaring rtl-buddy-xeno as a proper `[mut]` optional dependency so this
# runs from a clean `uv sync` is tracked in rtl-buddy/rtl_buddy#239.
# ────────────────────────────────────────────────────────────────────────
#
# Mutation campaign for demo_fpv_basic. The mutation engine
# (rtl-buddy-xeno) rewrites the design file; each mutant is re-proved
# against the `verify` FPV verification below. A mutant is "killed" when
# the proof flips from PASS to FAIL, "survived" when it still passes
# (a signal that the property set is too weak to notice that change).
name: "demo_fpv_basic"
model: "demo_fpv_basic"
model_path: "../../design/demo_abv/models.yaml"

# The single design file to mutate (must live within the model dir so
# each mutant can be materialised into an isolated copy of the tree).
design_file: "../../design/demo_abv/demo_fpv_basic.sv"

# Which xeno MutationKinds to apply. These are the operators that have
# candidate sites in this counter: the saturating `+`, the enable/bound
# condition, and the register assignment.
operators:
  - arith_flip      # cnt + 1  ->  cnt - 1
  - cond_negate     # (en && cnt < MAX)  ->  !(en && cnt < MAX)
  - cond_const      # condition -> 1 / -> 0
  - assign_drop     # drop the counter's non-blocking assignment

# The kill oracle: the bounded safety proof. A mutant is killed when it
# makes this verification FAIL.
verify:
  fpv_config: "fpv.yaml"
  verification: "demo_fpv_basic_safety"

budget:
  max_mutants: 20
  schedule: round_robin
