# RTL-Buddy FPV Configuration File
rtl-buddy-filetype: fpv_config

# Each entry drives SymbiYosys against the named model. `properties:`
# files are bound checker modules; `top:` is the DUT (the bind brings
# the checker in alongside it). Paths are resolved relative to this
# file.
#
# frontend: slang is required — the checker reaches the DUT via a
# `bind`, which only the yosys-slang frontend elaborates (the native
# verilog frontend silently drops it). Point cfg-fpv-tools.opts.
# plugin-path at your built slang.so (see root_config.yaml).
verifications:
  - name: "demo_fpv_basic_safety"
    desc: "Bounded proof: counter never overflows past MAX"
    tool: "sby"
    frontend: "slang"
    model: "demo_fpv_basic"
    model_path: "../../design/demo_abv/models.yaml"
    top: "demo_fpv_basic"
    properties:
      - "demo_fpv_basic_props.sv"
    mode: "bmc"
    depth: 32
    engines:
      - "smtbmc yices"

  - name: "demo_fpv_basic_reaches_max"
    desc: "Cover: a trace exists where counter == MAX"
    tool: "sby"
    frontend: "slang"
    model: "demo_fpv_basic"
    model_path: "../../design/demo_abv/models.yaml"
    top: "demo_fpv_basic"
    properties:
      - "demo_fpv_basic_props.sv"
    mode: "cover"
    depth: 32
    engines:
      - "smtbmc yices"
