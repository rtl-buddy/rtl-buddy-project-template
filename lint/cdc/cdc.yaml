# RTL-Buddy CDC Configuration File
rtl-buddy-filetype: cdc_config

# Each entry runs the configured CDC tool against the named model.
# `constraints:` is the SDC; `waivers:` is optional. Paths are resolved
# relative to this file. The analyses below intentionally cover both the
# default Yosys-backed path and newer slang / blackbox flows.
analyses:
  - name: "ip_cdc_handshake_lint"
    desc: "CDC lint of the request/ack handshake IP"
    model: "ip_cdc_handshake"
    model_path: "../../design/common/models.yaml"
    tool: "rtl-buddy-cdc"
    constraints: "ip_cdc_handshake.sdc"

  - name: "demo_tiny_alu_subsys_lint"
    desc: "CDC lint of the multi-clock ALU accelerator (apb_clk ↔ cclk)"
    model: "demo_tiny_alu_subsys_top"
    model_path: "../../design/demo_tiny_alu_subsys/models.yaml"
    tool: "rtl-buddy-cdc"
    constraints: "demo_tiny_alu_subsys.sdc"
    waivers: "demo_tiny_alu_subsys.waivers"
    # This top has a SystemVerilog interface port (apb_intf.subordinate
    # apb). The yosys read paths can't elaborate it cleanly — read_verilog
    # turns the interface into phantom nets, read_slang can't represent a
    # top-level interface port at all — so this analysis uses the pyslang
    # frontend, which elaborates the interface hierarchy natively.
    frontend: "slang"

  - name: "demo_cdc_src_sync_lint"
    desc: >-
      Source-synchronous chain (A → B0/B1 → C0/C1) verified via
      internal-pin create_generated_clock declarations rooted at ck_a.
    model: "demo_cdc_src_sync_top"
    model_path: "../../design/demo_cdc_src_sync/models.yaml"
    tool: "rtl-buddy-cdc"
    constraints: "demo_cdc_src_sync.sdc"

  - name: "demo_cdc_open_lint"
    desc: >-
      Portable CDC block (2FF, Gray bus, req/ack handshake, reset sync)
      carrying only vendor-neutral ASYNC_REG/keep. Recognition half of
      the open FPGA demo — reports the crossings safe before
      `rb fpga tool: openxc7` implements it (see ../../fpga/demo_cdc_open/),
      and feeds the scoped generate→audit loop (see check_cdc_xdc.sh).
    model: "demo_cdc_open_top"
    model_path: "../../design/demo_cdc_open/models.yaml"
    tool: "rtl-buddy-cdc"
    constraints: "demo_cdc_open.sdc"
    # slang preserves the synchronizer instance hierarchy, which
    # `rb cdc --emit-constraints --scoped` needs to address IP-relative
    # cells (SCOPED_TO_REF). The default yosys frontend `flatten`s that
    # hierarchy away — scoped emit then errors rather than emitting
    # over-broad `<top>/*` wildcards. slang also elaborates the
    # `(* cdc_handshake *)`-annotated held-payload bus without a CDC-012
    # false positive (rtl-buddy-cdc >= 0.3.3).
    frontend: "slang"

  # Blackboxes a single-clock SRAM macro for CDC scaling. The `blackbox:` key
  # is forwarded as `--blackbox sram_sp`, which needs rtl-buddy-cdc >= 0.3.0
  # (rtl-buddy-cdc#259) and an rtl_buddy release with the blackbox key
  # (rtl_buddy#318). Abstracting the macro is result-preserving: identical
  # crossings/violations vs the flat run, with its internals removed.
  - name: "demo_cdc_mem_macro_lint"
    desc: >-
      Blackbox a single-clock SRAM macro for CDC scaling: the clk_h -> clk_m
      crossing is preserved while sram_sp's internals are abstracted away.
    model: "mem_subsys"
    model_path: "../../design/demo_cdc_mem_macro/models.yaml"
    tool: "rtl-buddy-cdc"
    constraints: "demo_cdc_mem_macro.sdc"
    blackbox: ["sram_sp"]
