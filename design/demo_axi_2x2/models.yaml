rtl-buddy-filetype: model_config
models:
  - name: axi_2x2
    desc: 2x2 AXI4 crossbar (pulp-platform) — demonstration target for rb axi-profile
    filelist:
      - -F axi_2x2.f
    # The checked-in manifest describes the AXI ports (which the macro
    # RTL hides from the CST) — `rb axi-profile run` reads it and the
    # rtl-buddy-view axi-perf overlay attaches each bundle to the real
    # tb_axi_2x2.dut node from it (no profiler-specific system_view.sv).
    axi_bundles: axi_2x2.axi-bundles.yaml

  # The testbench top (tb_axi_2x2) is the natural view/profiling target for
  # AXI perf — the overlay attaches to the real tb_axi_2x2.dut node.
  # Listed as a model so `rb hub start --model tb_axi_2x2` serves it and
  # it appears in the SPA model picker.
  - name: tb_axi_2x2
    desc: AXI 2x2 testbench top — AXI-perf view target (tb_axi_2x2 → dut)
    filelist:
      - -F axi_2x2.f
      - +incdir+../../common
      - ../../verif/demo_axi_2x2/tb_axi_2x2.sv
    axi_bundles: axi_2x2.axi-bundles.yaml
