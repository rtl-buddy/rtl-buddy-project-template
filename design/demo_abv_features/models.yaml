rtl-buddy-filetype: model_config

# Inline-assertion variant of demo_fpv_counter. The DUT carries its
# own `assert` / `assume` statements so both Verilator (`rb test`)
# and yosys (`rb fpv`) see the same property set, demoing ABV end-
# to-end.
models:
  - name: "demo_abv_features"
    desc: "Saturating counter with inline SVA — demos ABV across rb test + rb fpv"
    filelist: ["-v demo_abv_features.sv"]
