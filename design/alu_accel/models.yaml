rtl-buddy-filetype: model_config

models:
  - name: "alu_accel_top"
    desc: "Multi-clock APB-mapped ALU accelerator (CSR-direct + FIFO stream)"
    filelist: ["-F alu_accel.f"]
    spec: "../../spec/alu_accel/specs.yaml"

  - name: "alu_accel_compute"
    desc: "Compute-domain core that drives the alu (used in standalone tests)"
    filelist:
      - "-v ../sandbox/alu.sv"
      - "-v alu_accel_compute.sv"
    spec: "../../spec/alu_accel/specs.yaml"

  - name: "alu_accel_synth_top"
    desc: "Flat-port synthesis wrapper around alu_accel_top (used by rb synth)"
    filelist: ["-F alu_accel_synth.f"]
    spec: "../../spec/alu_accel/specs.yaml"
