# RTL-Buddy RTL Model Configuration File
rtl-buddy-filetype: model_config

models:
  - name      : "pp_axi"
    filelist  : [ "-F pp_axi.f" ]
    # A vendored library collection: no module is named pp_axi, so the
    # design graph elaborates the crossbar as this model's root instead
    # (rtl_buddy >=6.44.0, rtl-buddy/rtl_buddy#479).
    top       : "axi_xbar"
