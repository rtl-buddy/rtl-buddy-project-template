rtl-buddy-filetype: model_config

# Wrapping mod-5 counter used to demonstrate the BMC-vs-induction
# distinction under `rb fpv`. Formal-only teaching block — never
# simulated. The checker modules that assert the properties live next
# to fpv.yaml (`fpv/demo_abv_induction/demo_abv_induction_props.sv`) and
# are pulled in per-verification via the fpv `properties:` list.
models:
  - name: "demo_abv_induction"
    desc: "Wrapping counter — demos how a true property can pass BMC yet fail induction"
    filelist: ["-v demo_abv_induction.sv"]
