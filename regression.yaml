# ip_cdc_handshake, ip_async_fifo) prove each component on its own;
# alu_accel is the system-level demonstrator that integrates them.
test-configs:
  - "verif/apb/tests.yaml"
  - "verif/ip_cdc_sync/tests.yaml"
  - "verif/ip_cdc_handshake/tests.yaml"
  - "verif/ip_async_fifo/tests.yaml"
  - "verif/sandbox/tests.yaml"
  - "verif/sandbox_cocotb/tests.yaml"
  - "verif/cocotb_ex/tests.yaml"
  - "verif/alu_accel/tests.yaml"
