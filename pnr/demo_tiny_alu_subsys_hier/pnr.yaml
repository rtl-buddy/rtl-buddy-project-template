# RTL-Buddy P&R Configuration File
rtl-buddy-filetype: pnr_config

# P&R half of the sky130hd hierarchical pipeclean. Four runs in two groups:
#
#   ..._flat_pnr       the reference. One flat run of the whole design, with the
#                      OpenRAM SRAM as its only hard macro.
#
#   ..._csr_pnr        partition A, hardened on its own clock (`harden: true`).
#   ..._compute_pnr    partition B, hardened on its own clock (`harden: true`).
#   ..._asm_pnr        the assembly. Places and routes the top with both
#                      partitions (`blocks:`) and the SRAM as hard macros, and
#                      ties all three into the top-level PDN.
#
# Plus one stand-alone example, `..._compute_mc_pnr`: partition B signed off at
# tt, ss and ff at once on the multi-corner `sky130hd_mc` platform. It needs
# only `rb synth demo_tiny_alu_subsys_sky130_compute` first.
#
# And another: `..._planner_pnr`, the flat reference floorplanned from the
# planner files in plan/. It needs only `rb synth demo_tiny_alu_subsys_sky130_flat`
# first.
#
# And three more on the flat reference, all needing only that synthesis:
# `..._tight_pnr` and `..._repair_pnr` run it at a tighter apb_clk, the second
# as a staged run with post-route repair, and `..._probe_pnr`
# checks a denser floorplan in seconds. See README.md, "Staged runs and timing
# repair".
#
# Run order is flat (any time), then csr and compute, then the assembly's
# synthesis and P&R. The assembly refuses to run on a partition that has no
# abstract, or whose abstract no longer matches its sources. See README.md for
# the full walk-through.
#
# Everything is reglvl 1000 — these need the downloaded PDK, the downloaded
# macro, openroad and klayout. Invoke directly, e.g.
#
#   rb pnr demo_tiny_alu_subsys_sky130_flat_pnr -c pnr/demo_tiny_alu_subsys_hier/pnr.yaml --gds --png
#
# Or all of it, from nothing, partitions before the assembly (rtl_buddy#95):
#
#   rb pnr -c pnr/demo_tiny_alu_subsys_hier/pnr.yaml -l 1000 --synth -j 2 --gds
runs:

  # ── flat reference ─────────────────────────────────────────────────────────
  - name: "demo_tiny_alu_subsys_sky130_flat_pnr"
    desc: "Flat sky130hd P&R of demo_tiny_alu_subsys, OpenRAM SRAM as the only macro"
    tool: "openroad"
    synth: "demo_tiny_alu_subsys_sky130_flat"
    synth-path: "../../synth/demo_tiny_alu_subsys_hier/synth.yaml"
    constraints: "../../synth/demo_tiny_alu_subsys_hier/constraints_flat.sdc"
    platform: "sky130hd_tt"
    floorplan:
      utilization: 0.45
      aspect: 1.0
      core-margin: 10.0
    lef-paths:
      - "../../pdk/sky130_sram/sky130_sram_1kbyte_1rw1r_32x256_8.lef"
    lib-paths:
      - "../../pdk/sky130_sram/sky130_sram_1kbyte_1rw1r_32x256_8_TT_1p8V_25C.lib"
    gds-paths:
      - "../../pdk/sky130_sram/sky130_sram_1kbyte_1rw1r_32x256_8.gds"
    # Nothing here is a placeholder: the SRAM's real GDS is above, so a cell
    # with no layout would be a bug, not a preview.
    gds-mode: strict
    reglvl: 1000

  # ── multi-corner example ───────────────────────────────────────────────────
  # Multi-corner signoff (rtl_buddy#104 / rtl_buddy#105): the compute
  # partition placed and routed as a top of its own and signed off at tt, ss
  # and ff in one OpenROAD session — see `sky130hd_mc` in root_config.yaml.
  #
  # Not the flat run: its OpenRAM SRAM ships one (TT) Liberty whose address
  # and write-mask pins carry `max_transition: 0.04` ns. On a multi-corner
  # platform `repair_design` checks every corner's limit against the fastest
  # buffer at the slowest corner (0.061 ns at ss) and stops with RSZ-0090.
  # The flat design signed off at three corners, with SRAM Liberty derived per
  # corner, is pnr/demo_tiny_alu_subsys_mc/.
  - name: "demo_tiny_alu_subsys_sky130_compute_mc_pnr"
    desc: "sky130hd P&R of the compute partition, multi-corner signoff (tt/ss/ff)"
    tool: "openroad"
    synth: "demo_tiny_alu_subsys_sky130_compute"
    synth-path: "../../synth/demo_tiny_alu_subsys_hier/synth.yaml"
    constraints: "../../synth/demo_tiny_alu_subsys_hier/constraints_compute.sdc"
    platform: "sky130hd_mc"
    floorplan:
      utilization: 0.40
      aspect: 1.0
      core-margin: 10.0
    reglvl: 1000

  # ── partition A: CSR block ─────────────────────────────────────────────────
  # Hardened on apb_clk with its own SDC and its own floorplan. `harden: true`
  # publishes the routed result as
  # artefacts/<run>/abstract/demo_tiny_alu_subsys_csr.{lef,lib,gds} plus
  # abstract.manifest.json, and forces a strict stream-out: a hardened block
  # with a hole in its layout is never acceptable.
  - name: "demo_tiny_alu_subsys_sky130_csr_pnr"
    desc: "Harden the demo_tiny_alu_subsys_csr partition (apb_clk)"
    tool: "openroad"
    synth: "demo_tiny_alu_subsys_sky130_csr"
    synth-path: "../../synth/demo_tiny_alu_subsys_hier/synth.yaml"
    constraints: "../../synth/demo_tiny_alu_subsys_hier/constraints_csr.sdc"
    # Not sky130hd_tt: a block that a larger design will instantiate needs the
    # block-level power grid (straps exposed on met4, nothing on met5) and
    # block-level routing layers. See pnr/sky130hd/pdn_block.tcl.
    platform: "sky130hd_tt_block"
    floorplan:
      utilization: 0.40
      aspect: 1.0
      core-margin: 5.0
    harden: true
    reglvl: 1000

  # ── partition B: compute datapath ──────────────────────────────────────────
  - name: "demo_tiny_alu_subsys_sky130_compute_pnr"
    desc: "Harden the demo_tiny_alu_subsys_compute partition (compute clock)"
    tool: "openroad"
    synth: "demo_tiny_alu_subsys_sky130_compute"
    synth-path: "../../synth/demo_tiny_alu_subsys_hier/synth.yaml"
    constraints: "../../synth/demo_tiny_alu_subsys_hier/constraints_compute.sdc"
    platform: "sky130hd_tt_block"
    floorplan:
      utilization: 0.40
      aspect: 1.0
      core-margin: 5.0
    harden: true
    reglvl: 1000

  # ── top-level assembly ─────────────────────────────────────────────────────
  # The two partitions come in through `blocks:`, which resolves each one to
  # the abstract its `harden: true` run above published. The SRAM stays in
  # lef-paths / lib-paths / gds-paths: it is a third-party macro, not a block
  # this project hardens.
  - name: "demo_tiny_alu_subsys_sky130_asm_pnr"
    desc: "Assemble the top from two hardened partitions plus the third-party SRAM"
    tool: "openroad"
    synth: "demo_tiny_alu_subsys_sky130_asm"
    synth-path: "../../synth/demo_tiny_alu_subsys_hier/synth.yaml"
    constraints: "../../synth/demo_tiny_alu_subsys_hier/constraints_flat.sdc"
    platform: "sky130hd_tt"
    # The same floorplan as the flat reference. The size-aware shelf packer
    # (rtl_buddy#632) packs the three macros from the bottom-left corner
    # instead of giving each one an SRAM-sized slot in a rectangular grid, so
    # the assembly no longer needs a wide flat strip to hold them. The channel
    # widths that `pdngen` needs come from `placement.macro-halo` (20 µm by
    # default; see root_config.yaml), not from an inflated core.
    floorplan:
      utilization: 0.45
      aspect: 1.0
      core-margin: 10.0
    lef-paths:
      - "../../pdk/sky130_sram/sky130_sram_1kbyte_1rw1r_32x256_8.lef"
    lib-paths:
      - "../../pdk/sky130_sram/sky130_sram_1kbyte_1rw1r_32x256_8_TT_1p8V_25C.lib"
    gds-paths:
      - "../../pdk/sky130_sram/sky130_sram_1kbyte_1rw1r_32x256_8.gds"
    blocks:
      - name: demo_tiny_alu_subsys_csr
        pnr: demo_tiny_alu_subsys_sky130_csr_pnr
      - name: demo_tiny_alu_subsys_compute
        pnr: demo_tiny_alu_subsys_sky130_compute_pnr
    # The acceptance criterion for the whole example. All three macro layouts
    # are real, so `strict` must pass with no `gds-allow-empty` entries at all:
    # an empty cell here would mean a hardened partition streamed out as a hole.
    gds-mode: strict
    reglvl: 1000

  # ── the same assembly, macros placed by OpenROAD's RTL-MP ─────────────────
  # Identical to `..._asm_pnr` but for `floorplan.macro-placement: rtl-mp`:
  # `rtl_macro_placer` places (and rotates) the two partitions and the SRAM by
  # connectivity instead of the packer filling rows from a corner. Compare the
  # two rows of the results table in README.md.
  - name: "demo_tiny_alu_subsys_sky130_asm_rtlmp_pnr"
    desc: "The assembly with RTL-MP macro placement instead of the packer"
    tool: "openroad"
    synth: "demo_tiny_alu_subsys_sky130_asm"
    synth-path: "../../synth/demo_tiny_alu_subsys_hier/synth.yaml"
    constraints: "../../synth/demo_tiny_alu_subsys_hier/constraints_flat.sdc"
    platform: "sky130hd_tt"
    floorplan:
      utilization: 0.45
      aspect: 1.0
      core-margin: 10.0
      macro-placement: rtl-mp
    # A 20 µm halo around each macro. Without one, RTL-MP leaves no channel
    # between the macros and the core edge, and global route overflows there
    # (GRT-0116).
    placement:
      macro-halo: 20
    lef-paths:
      - "../../pdk/sky130_sram/sky130_sram_1kbyte_1rw1r_32x256_8.lef"
    lib-paths:
      - "../../pdk/sky130_sram/sky130_sram_1kbyte_1rw1r_32x256_8_TT_1p8V_25C.lib"
    gds-paths:
      - "../../pdk/sky130_sram/sky130_sram_1kbyte_1rw1r_32x256_8.gds"
    blocks:
      - name: demo_tiny_alu_subsys_csr
        pnr: demo_tiny_alu_subsys_sky130_csr_pnr
      - name: demo_tiny_alu_subsys_compute
        pnr: demo_tiny_alu_subsys_sky130_compute_pnr
    gds-mode: strict
    reglvl: 1000

  # ── the flat reference, floorplanned from planner files ────────────────────
  # What a floorplanner hands over, read from plan/ instead of typed here:
  # where the SRAM sits and which way it is oriented (plan/macros.yaml), and
  # where each pin goes (plan/pins.yaml). See README.md, "Planner files".
  - name: "demo_tiny_alu_subsys_sky130_planner_pnr"
    desc: "Flat sky130hd P&R with the SRAM at R180 and macro and pin positions from planner files"
    tool: "openroad"
    synth: "demo_tiny_alu_subsys_sky130_flat"
    synth-path: "../../synth/demo_tiny_alu_subsys_hier/synth.yaml"
    constraints: "../../synth/demo_tiny_alu_subsys_hier/constraints_flat.sdc"
    platform: "sky130hd_tt"
    floorplan:
      # The planner owns the die: no utilization or aspect to derive it from.
      die-area: [0, 0, 800, 700]
      core-area: [10, 10, 790, 690]
      macros-file: plan/macros.yaml
      # Keep the planner's locations exact. The default `true` would snap the
      # SRAM and each pin to the site grid or a routing track.
      macro-snap: false
      pins-file: plan/pins.yaml
      pin-snap: false
      # Fail before placing pins if any signal port has no entry, or two.
      pins-complete: true
      blockages:
        # A screen for global placement only: the planner wants this region
        # kept to 35% cell density while cells are placed. The blockage is
        # removed right after, so legalization, repair and routing never see it.
        - rect: [600, 300, 700, 400]
          type: partial
          max-density: 0.35
          lifetime: global-placement
    lef-paths:
      - "../../pdk/sky130_sram/sky130_sram_1kbyte_1rw1r_32x256_8.lef"
    lib-paths:
      - "../../pdk/sky130_sram/sky130_sram_1kbyte_1rw1r_32x256_8_TT_1p8V_25C.lib"
    gds-paths:
      - "../../pdk/sky130_sram/sky130_sram_1kbyte_1rw1r_32x256_8.gds"
    gds-mode: strict
    reglvl: 1000

  # ── the flat reference at a tighter clock ──────────────────────────────────
  # apb_clk at 12.6 ns (constraints_flat_tight.sdc) instead of 20 ns, and
  # `placement.timing-driven` (rtl-buddy/rtl_buddy#867): global placement
  # weights the nets on the worst setup paths. The flow's default repairs run,
  # the last of them after global route; the SRAM's read path still misses
  # setup and nothing repairs it after detailed routing. The reference for
  # `..._repair_pnr`.
  - name: "demo_tiny_alu_subsys_sky130_tight_pnr"
    desc: "Flat sky130hd P&R at a 12.6 ns apb_clk with timing-driven placement, no post-route repair"
    tool: "openroad"
    synth: "demo_tiny_alu_subsys_sky130_flat"
    synth-path: "../../synth/demo_tiny_alu_subsys_hier/synth.yaml"
    constraints: "constraints_flat_tight.sdc"
    platform: "sky130hd_tt"
    floorplan:
      utilization: 0.45
      aspect: 1.0
      core-margin: 10.0
    placement:
      timing-driven: true
    lef-paths:
      - "../../pdk/sky130_sram/sky130_sram_1kbyte_1rw1r_32x256_8.lef"
    lib-paths:
      - "../../pdk/sky130_sram/sky130_sram_1kbyte_1rw1r_32x256_8_TT_1p8V_25C.lib"
    gds-paths:
      - "../../pdk/sky130_sram/sky130_sram_1kbyte_1rw1r_32x256_8.gds"
    gds-mode: strict
    reglvl: 1000

  # ── the same run, staged, with repair ──────────────────────────────────────
  # What this run adds to `..._tight_pnr` (rtl-buddy/rtl_buddy#848, #849):
  #
  #   stages               each stage is its own OpenROAD session and writes a
  #                        checkpoint, so the run can stop after one
  #                        (`--stop-after`), resume from one (`--resume`), or
  #                        run each stage as a Slurm job (`--dispatch slurm`).
  #   global-route-repair  after global route, `repair_design` for slew and
  #                        capacitance with a 20% margin. A written block runs
  #                        only what it sets, so this run leaves out the setup
  #                        and hold repair the default block runs there.
  #   post-route-repair    rounds that extract the routed design and, while
  #                        setup slack is negative, repair setup with a 0.05 ns
  #                        margin (0.10 ns in round 2) and route the changed
  #                        nets again (`reroute: eco`). Needs the PDK's
  #                        `rcx-rules`, which sky130hd sets.
  #   resources            the Slurm reservation of each stage job under
  #                        `--dispatch slurm`; ignored otherwise. OpenROAD
  #                        picks its own thread count unless `threads:` sets
  #                        one.
  - name: "demo_tiny_alu_subsys_sky130_repair_pnr"
    desc: "Staged flat sky130hd P&R at a 12.6 ns apb_clk with global-route and post-route repair"
    tool: "openroad"
    synth: "demo_tiny_alu_subsys_sky130_flat"
    synth-path: "../../synth/demo_tiny_alu_subsys_hier/synth.yaml"
    constraints: "constraints_flat_tight.sdc"
    platform: "sky130hd_tt"
    floorplan:
      utilization: 0.45
      aspect: 1.0
      core-margin: 10.0
    placement:
      timing-driven: true
    stages: true
    global-route-repair:
      repair-design: {slew-margin: 20, cap-margin: 20}
    post-route-repair:
      setup-margin: 0.05
      rounds: 2
      margin-step: 0.05
      reroute: eco
    resources:
      cpus: 1
      mem: 4G
      time: "00:30:00"
      stages:
        detailed_route: {cpus: 1, mem: 8G, time: "01:00:00"}
        post_route_repair: {cpus: 1, mem: 8G, time: "01:00:00"}
    lef-paths:
      - "../../pdk/sky130_sram/sky130_sram_1kbyte_1rw1r_32x256_8.lef"
    lib-paths:
      - "../../pdk/sky130_sram/sky130_sram_1kbyte_1rw1r_32x256_8_TT_1p8V_25C.lib"
    gds-paths:
      - "../../pdk/sky130_sram/sky130_sram_1kbyte_1rw1r_32x256_8.gds"
    gds-mode: strict
    reglvl: 1000

  # ── a probe of a denser floorplan ──────────────────────────────────────────
  # `mode: probe` runs placement and global route only, without the timing
  # repair, and stops with its `global_route` checkpoint: a quick answer to
  # whether a floorplan places and routes (rtl-buddy/rtl_buddy#849). This one
  # asks it of the flat reference at 70% utilization instead of 45%. The result
  # is a PASS with `routed: false`, never a routed design.
  - name: "demo_tiny_alu_subsys_sky130_probe_pnr"
    desc: "Probe of the flat reference at 70% utilization: placement and global route only"
    tool: "openroad"
    mode: probe
    synth: "demo_tiny_alu_subsys_sky130_flat"
    synth-path: "../../synth/demo_tiny_alu_subsys_hier/synth.yaml"
    constraints: "../../synth/demo_tiny_alu_subsys_hier/constraints_flat.sdc"
    platform: "sky130hd_tt"
    floorplan:
      utilization: 0.70
      aspect: 1.0
      core-margin: 10.0
    lef-paths:
      - "../../pdk/sky130_sram/sky130_sram_1kbyte_1rw1r_32x256_8.lef"
    lib-paths:
      - "../../pdk/sky130_sram/sky130_sram_1kbyte_1rw1r_32x256_8_TT_1p8V_25C.lib"
    gds-paths:
      - "../../pdk/sky130_sram/sky130_sram_1kbyte_1rw1r_32x256_8.gds"
    reglvl: 1000
