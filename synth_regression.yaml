# RTL-Buddy Synthesis Regression Configuration File
rtl-buddy-filetype: synth_reg_config

# Discoverable list of synth.yaml files. `rb synth-regression` walks each
# entry. Tech-mapped runs are gated by reglvl (see synth/demo_tiny_alu/synth.yaml).
synth-configs:
  - "synth/demo_tiny_alu/synth.yaml"
  - "synth/demo_tiny_alu_subsys/synth.yaml"
  - "synth/demo_cdc_src_sync/synth.yaml"
  - "synth/demo_slang_pkg/synth.yaml"   # reglvl 1000 — opt-in via --reg-level once yosys-slang is set up
