name: Verilator Regression

# This workflow runs the rtl_buddy regression suite inside the official
# Verilator Docker container. It installs project dependencies (including
# rtl_buddy) from the committed uv.lock, builds SystemC from source (cached
# across runs), exports SYSTEMC_HOME, then runs the regression defined in
# regression.yaml.
#
# Trigger on every push. Common alternatives:
#   on:
#     push:
#       branches: [main]
#     pull_request:
#       branches: [main]
on: [push]

env:
  # Accellera SystemC release used by the SystemC cosim suites. Bump the
  # tag here when you want to roll forward; the build step rebuilds and
  # the actions/cache key picks up the new version automatically.
  SYSTEMC_VERSION: "3.0.2"

jobs:
  verilator-test:
    runs-on: ubuntu-latest
    container:
      # The official Verilator image provides a ready-to-use Verilator
      # installation on Ubuntu. Pin to a specific release tag so CI is
      # reproducible. Browse available tags at:
      # https://hub.docker.com/r/verilator/verilator/tags
      image: verilator/verilator:v5.048

    steps:
      # regression_ci.yaml's suites are all in-repo (leaf IP + tiny_alu +
      # the SystemC cosim), so no vendor submodules are needed here — a
      # default checkout keeps it lean. The full pulp-platform AXI suite
      # (which does need submodules) runs via regression.yaml out-of-band.
      - uses: actions/checkout@v4

      # Install uv into the container. The package cache is keyed on
      # uv.lock so repeated runs with an unchanged lockfile skip downloads.
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      # Install the project's Python dependencies from the committed lockfile.
      # This includes rtl_buddy and any other packages declared in pyproject.toml.
      - name: Install dependencies
        run: uv sync --locked --python 3.11

      # SystemC install (cached) — required by verif/demo_tiny_alu_sc/.
      # First run builds + caches to /opt/systemc (~2 min); subsequent runs
      # restore the cache (~5 s).
      - name: Cache SystemC build
        id: systemc-cache
        uses: actions/cache@v4
        with:
          path: /opt/systemc
          key: systemc-${{ env.SYSTEMC_VERSION }}-${{ runner.os }}-v1

      - name: Build SystemC
        if: steps.systemc-cache.outputs.cache-hit != 'true'
        run: |
          apt-get update
          apt-get install -y --no-install-recommends cmake build-essential ca-certificates curl
          mkdir -p /tmp/sc-build && cd /tmp/sc-build
          curl -fsSL "https://github.com/accellera-official/systemc/archive/refs/tags/${SYSTEMC_VERSION}.tar.gz" | tar xz
          cd "systemc-${SYSTEMC_VERSION}"
          cmake -B build -DCMAKE_INSTALL_PREFIX=/opt/systemc -DBUILD_SHARED_LIBS=OFF -DCMAKE_CXX_STANDARD=17
          cmake --build build -j"$(nproc)"
          cmake --install build

      - name: Export SYSTEMC_HOME
        run: echo "SYSTEMC_HOME=/opt/systemc" >> "$GITHUB_ENV"

      - name: Run regression
        # Fast smoke regression (regression_ci.yaml): leaf IP + the
        # canonical demo_tiny_alu + one SystemC cosim test, so the
        # SystemC build/cosim path stays validated on every push without
        # the multi-minute full suite. The full regression.yaml (cocotb,
        # pulp-platform AXI, ABV, subsys) runs locally / out-of-band.
        #
        # Useful options:
        #   -c <path>           path to regression config
        #   -l <N>              stop after regression level N
        #   -M reg|debug|cov    builder mode override (default: reg)
        run: uv run rtl-buddy --machine -B verilator regression -c regression_ci.yaml

  verilator-coverage:
    runs-on: ubuntu-latest
    container:
      image: verilator/verilator:v5.048

    steps:
      # regression_cov_ci.yaml exercises only demo_tiny_alu (pure
      # Verilator), so this job needs no vendor submodules and no
      # SystemC — a default checkout keeps it lean.
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        run: uv sync --locked --python 3.11

      # `--coverage-html` shells out to lcov's genhtml; the Verilator
      # base image does not ship it.
      - name: Install lcov
        run: |
          apt-get update
          apt-get install -y --no-install-recommends lcov

      - name: Run coverage regression
        # Stripped-down coverage run: full instrumentation fidelity
        # (expr/line/toggle/user, per root_config.yaml's `cov` mode) on a
        # single multi-test DUT, to exercise the per-test -> merge -> lcov
        # HTML flow without re-covering the whole project. verilator-test
        # already runs the full regression.yaml on every push.
        run: |
          uv run rtl-buddy --machine -B verilator -M cov regression \
            -c regression_cov_ci.yaml --coverage-merge --coverage-html

      - name: Upload merged LCOV HTML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: coverage_merge.html/
          if-no-files-found: error

      - name: Upload merged LCOV data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-data
          path: cov_dir/coverage_merged.info
          if-no-files-found: error
